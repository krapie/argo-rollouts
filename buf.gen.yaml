version: v2
plugins:
  # Generate Go protobuf stubs using standard protobuf (replaces gogo protobuf)
  - remote: buf.build/protocolbuffers/go:v1.35.2
    out: .
    opt:
      - paths=source_relative
  # Generate Go gRPC stubs
  - remote: buf.build/grpc/go:v1.5.1
    out: .
    opt:
      - paths=source_relative
  # Generate grpc-gateway reverse proxy
  - remote: buf.build/grpc-ecosystem/gateway:v2.20.0
    out: .
    opt:
      - paths=source_relative
      - logtostderr=true
  # Generate OpenAPI/Swagger documentation
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.20.0
    out: .
    opt:
      - logtostderr=true
