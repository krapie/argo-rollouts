syntax = "proto3";

package github.com.argoproj.argo_rollouts.pkg.apis.rollouts.v1alpha1;
option go_package = "github.com/argoproj/argo-rollouts/pkg/apis/rollouts/v1alpha1";

import "google/protobuf/timestamp.proto";

// Simplified ObjectMeta for basic metadata
message ObjectMeta {
  string name = 1;
  string namespace = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
  google.protobuf.Timestamp creationTimestamp = 5;
}

// Simplified Time wrapper
message Time {
  google.protobuf.Timestamp time = 1;
}

// Basic Rollout definition
message Rollout {
  ObjectMeta metadata = 1;
  RolloutSpec spec = 2;
  RolloutStatus status = 3;
}

message RolloutSpec {
  string strategy = 1;
}

message RolloutStatus {
  string phase = 1;
}

// Basic CanaryStep for demonstration
message CanaryStep {
  string setWeight = 1;
  string pause = 2;
}

// Basic AnalysisRun types
message AnalysisRunSpec {
  string template = 1;
}

message AnalysisRunStatus {
  string phase = 1;
}
